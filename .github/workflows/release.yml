name: Publish Finto for Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install innosetup --no-progress --yes
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq "push") {
            throw "VERSION ($version) must match tag ${{ github.ref_name }}."
          }
      - name: Import code-signing certificate
        id: certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'finto-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "signtool=C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" >> $env:GITHUB_OUTPUT
      - name: Build signed release
        if: steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\packaging\Build-Windows.ps1 -Python $python -Installer -SignTool "${{ steps.certificate.outputs.signtool }}" -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}"
      - name: Build unsigned release
        if: steps.certificate.outputs.thumbprint == ''
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\packaging\Build-Windows.ps1 -Python $python -Installer
      - name: Create update manifest
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\packaging\New-ReleaseManifest.ps1 -Version $version -Repository "${{ github.repository }}"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "v$version" dist/Finto.exe "dist/Finto-Setup-$version.exe" dist/release.json --title "Finto $version" --notes-file RELEASE_NOTES.md
